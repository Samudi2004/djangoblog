{% extends "blog/base.html" %}

{% block title %}
Delete Post
{% endblock %}

{% block content %}

<div class="card">

    <div class="card-body">

        <h2 class="text-danger">Delete Post</h2>

        <hr>

        <p>
            Are you sure you want to delete
            <strong>"{{ object.title }}"</strong>?
        </p>

        <form method="post">

            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Yes, Delete
            </button>

            <a href="{% url 'post_detail' object.slug %}"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
